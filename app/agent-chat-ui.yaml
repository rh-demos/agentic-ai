apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-chat-ui
  labels:
    app: agent-chat-ui
    app.kubernetes.io/name: agent-chat-ui
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-chat-ui
  template:
    metadata:
      labels:
        app: agent-chat-ui
        app.kubernetes.io/name: agent-chat-ui
        app.kubernetes.io/component: frontend
    spec:
      containers:
      - name: chat-ui
        image: quay.io/jonkey/agent-chat-ui:1.0.2
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: http
          protocol: TCP
        env:
        - name: CHAT_UI_PORT
          value: "3000"
        - name: FASTAPI_URL
          value: "http://langgraph-fastapi:8000"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: agent-chat-ui
  labels:
    app: agent-chat-ui
    app.kubernetes.io/name: agent-chat-ui
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  ports:
  - port: 3000
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: agent-chat-ui

---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: agent-chat-ui
  labels:
    app: agent-chat-ui
    app.kubernetes.io/name: agent-chat-ui
    app.kubernetes.io/component: frontend
  annotations:
    haproxy.router.openshift.io/timeout: 120s  
spec:
  to:
    kind: Service
    name: agent-chat-ui
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
