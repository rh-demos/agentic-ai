kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: postgresql-finance-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  volumeMode: Filesystem

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgresql-finance
  labels:
    app: postgresql-finance
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgresql-finance
  template:
    metadata:
      labels:
        app: postgresql-finance
    spec:
      containers:
        - name: postgresql
          image: registry.redhat.io/rhel9/postgresql-15
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
              protocol: TCP
              name: postgres-fin
          env:
            - name: POSTGRESQL_USER
              value: "finance"
            - name: POSTGRESQL_PASSWORD
              value: "dummy"
            - name: POSTGRESQL_ADMIN_PASSWORD
              value: "dummy"
            - name: POSTGRESQL_DATABASE
              value: "fantaco_finance"
          volumeMounts:
            - name: postgres-finance-data
              mountPath: /var/lib/postgresql/data
          livenessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U postgres -d fantaco_finance
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              memory: 256Mi
              cpu: 250m
            limits:
              memory: 512Mi
              cpu: 500m
      volumes:
        - name: postgres-finance-data
          persistentVolumeClaim:
            claimName: postgresql-finance-data

---
apiVersion: v1
kind: Service
metadata:
  name: postgres-fin
  labels:
    app: postgres-fin
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
      name: postgres-fin
  selector:
    app: postgresql-finance

