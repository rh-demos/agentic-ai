kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: postgresql-customer-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  volumeMode: Filesystem

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgresql-customer
  labels:
    app: postgresql-customer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgresql-customer
  template:
    metadata:
      labels:
        app: postgresql-customer
    spec:
      containers:
        - name: postgresql
          image: registry.redhat.io/rhel9/postgresql-15
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
              protocol: TCP
              name: postgres-cust
          env:
            - name: POSTGRESQL_USER
              value: "customer"
            - name: POSTGRESQL_PASSWORD
              value: "dummy"
            - name: POSTGRESQL_ADMIN_PASSWORD
              value: "dummy"
            - name: POSTGRESQL_DATABASE
              value: "fantaco_customer"
          volumeMounts:
            - name: postgres-customer-data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              memory: 256Mi
              cpu: 250m
            limits:
              memory: 512Mi
              cpu: 500m
      volumes:
        - name: postgres-customer-data
          persistentVolumeClaim:
            claimName: postgresql-customer-data

---
apiVersion: v1
kind: Service
metadata:
  name: postgres-cust
  labels:
    app: postgres-cust
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: postgres-cust
      protocol: TCP
      name: postgres-cust
  selector:
    app: postgresql-customer
