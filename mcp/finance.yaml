apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-finance
  labels:
    app: mcp-finance
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-finance
  template:
    metadata:
      labels:
        app: mcp-finance
    spec:
      containers:
      - name: mcp-server
        image: quay.io/jonkey/mcp-server-finance:1.0.0
        imagePullPolicy: Always
        env:
        - name: FINANCE_API_BASE_URL
          value: "http://fantaco-finance-service:8082"
        ports:
        - containerPort: 9002
          name: http
          protocol: TCP
        resources:
          requests:
            memory: 128Mi
            cpu: 100m
          limits:
            memory: 256Mi
            cpu: 500m

---
apiVersion: v1
kind: Service
metadata:
  name: mcp-finance-service
  labels:
    app: mcp-finance
spec:
  type: ClusterIP
  selector:
    app: mcp-finance
  ports:
  - port: 9002
    targetPort: 9002
    protocol: TCP
    name: http
